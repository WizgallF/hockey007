# DDPG Configs
MODEL_IDENTIFIER: "ddpg"

NUM_EPISODES: 100
START_TRAINING: 0

EPS: 0.1
DISCOUNT: 0.95

BUFFER_SIZE: 1000000
BATCH_SIZE: 128
TRAIN_ITERATIONS: 1

# TD3 Options
TWIN_DELAYED: True
POLICY_NOISE: 0.1
NOISE_CLIP: 0.5
POLICY_DELAY: 2

LEARNING_RATE_ACTOR: 0.00001
LEARNING_RATE_CRITIC: 0.0001

HIDDEN_SIZES_ACTOR: [128, 128]
HIDDEN_SIZES_CRITIC: [128, 128, 64]

UPDATE_TARGET_EVERY: 10
USE_TARGET_NET: True
TAU: null

ACTION_NOISE_THETA: 0.15
ACTION_NOISE_DT: 0.01

# TD3-style optional knobs (leave defaults for pure DDPG behavior)
TWIN_DELAYED: False
POLICY_NOISE: 0.0
NOISE_CLIP: 0.5
POLICY_DELAY: 2
